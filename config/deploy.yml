# Deploy with `bin/kamal setup`. Every ENV value below is read from your shell, so no infrastructure lives in git.
#   KAMAL_SERVER, KAMAL_HOST, KAMAL_REGISTRY_USER, KAMAL_REGISTRY_PASSWORD, CORS_ORIGINS, SECRET_KEY_BASE, DB_PASSWORD
service: task_management_api
image: <%= ENV.fetch("KAMAL_REGISTRY_USER") %>/task-management-api

servers:
  web:
    - <%= ENV.fetch("KAMAL_SERVER") %>

# TLS terminates here (Let's Encrypt). Rails runs with assume_ssl/force_ssl on, so Secure cookies and HSTS work.
proxy:
  ssl: true
  host: <%= ENV.fetch("KAMAL_HOST") %>
  app_port: 80
  healthcheck:
    path: /up

registry:
  username: <%= ENV.fetch("KAMAL_REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    DB_HOST: task_management_api-db
    DB_USERNAME: task_management
    CORS_ORIGINS: <%= ENV.fetch("CORS_ORIGINS") %>
    SOLID_QUEUE_IN_PUMA: "true"
  secret:
    - SECRET_KEY_BASE
    - DB_PASSWORD

accessories:
  db:
    image: postgres:16-alpine
    host: <%= ENV.fetch("KAMAL_SERVER") %>
    env:
      clear:
        POSTGRES_USER: task_management
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

builder:
  arch: amd64
